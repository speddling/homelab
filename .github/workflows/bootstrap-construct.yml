name: Bootstrap Construct VM

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Force rebuild (destroys existing VM)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  provision:
    name: Provision Construct VM
    runs-on: [self-hosted, monolith]
    steps:
      - uses: actions/checkout@v4

      - name: Write vault password
        run: |
          mkdir -p ~/lwa-homelab
          echo '${{ secrets.ANSIBLE_VAULT_PASSWORD }}' > ~/lwa-homelab/.vault_pass
          chmod 600 ~/lwa-homelab/.vault_pass

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ansible
          ansible-galaxy collection install community.general ansible.posix

      - name: Destroy existing VM (if rebuild requested)
        if: github.event.inputs.rebuild == 'true'
        run: |
          # Stop the systemd service managing the QEMU/KVM VM
          sudo systemctl stop construct || true
          # Wait for any remaining QEMU process to exit
          for i in $(seq 1 10); do
            pgrep -f "qemu.*construct" || break
            sleep 2
          done
          # Force-kill any lingering QEMU process
          sudo pkill -f "qemu.*construct" || true
          sleep 3
          # Unmount the LVM volume from the mount point
          sudo umount /vm/construct || true
          # Remove the LVM logical volume (VG is ubuntu-vg per construct-vm role defaults)
          sudo lvremove -f /dev/ubuntu-vg/construct || true
          # Clean up mount point and any stale artifacts
          sudo rm -rf /vm/construct
          # Remove stale systemd service file if present
          sudo rm -f /etc/systemd/system/construct.service
          sudo systemctl daemon-reload || true

      - name: Run Ansible — Provision Construct
        working-directory: services/monolith/ansible
        run: |
          ansible-playbook -i inventory.ini playbooks/construct.yml \
            --vault-password-file ~/lwa-homelab/.vault_pass

      - name: Wait for VM to boot
        run: sleep 60

      - name: Verify VM is running
        run: |
          echo "Checking systemd service status..."
          sudo systemctl status construct --no-pager || true
          
          echo ""
          echo "Waiting for SSH port 2222 to be accessible..."
          timeout 30 bash -c 'until timeout 1 bash -c "</dev/tcp/localhost/2222" 2>/dev/null; do echo "  Waiting..."; sleep 2; done'
          echo "✅ Construct VM is accessible on port 2222"

      - name: Display connection info
        run: |
          echo "🎉 Construct VM provisioned successfully!"
          echo ""
          echo "Connect via:"
          echo "  ssh -p 2222 speddling@monolith  (port forward)"
          echo "  ssh speddling@construct         (Tailscale, once authenticated)"
          echo ""
          echo "Check Tailscale status:"
          echo "  ssh -p 2222 speddling@monolith 'sudo tailscale status'"
