apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: firecrawl-ingress
  namespace: firecrawl
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Restrict access to internal VLANs only (10, 20, 30)
    nginx.ingress.kubernetes.io/allow-cidrs: "192.168.10.0/24,192.168.20.0/24,192.168.30.0/24"
spec:
  rules:
    - host: firecrawl.littlewolfacres.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: firecrawl-api
                port:
                  number: 8080
  tls:
    - hosts:
        - firecrawl.littlewolfacres.com
      secretName: firecrawl-tls
