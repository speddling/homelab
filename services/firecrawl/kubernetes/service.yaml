apiVersion: v1
kind: Service
metadata:
  name: firecrawl-api
  namespace: firecrawl
  labels:
    app: firecrawl
    component: api
spec:
  selector:
    app: firecrawl
    component: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: firecrawl-redis
  namespace: firecrawl
  labels:
    app: firecrawl
    component: redis
spec:
  selector:
    app: firecrawl
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: firecrawl-postgres
  namespace: firecrawl
  labels:
    app: firecrawl
    component: postgres
spec:
  selector:
    app: firecrawl
    component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: firecrawl-rabbitmq
  namespace: firecrawl
  labels:
    app: firecrawl
    component: rabbitmq
spec:
  selector:
    app: firecrawl
    component: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
  type: ClusterIP
