apiVersion: v1
kind: ConfigMap
metadata:
  name: firecrawl-config
  namespace: firecrawl
  labels:
    app: firecrawl
    component: config
data:
  # Core configuration
  PORT: "8080"
  HOST: "0.0.0.0"
  ENV: "production"

  # Worker configuration
  NUM_WORKERS_PER_QUEUE: "8"
  CRAWL_CONCURRENT_REQUESTS: "10"
  MAX_CONCURRENT_JOBS: "5"
  BROWSER_POOL_SIZE: "5"

  # Service URLs (internal K8s service names)
  REDIS_URL: "redis://firecrawl-redis:6379"
  REDIS_RATE_LIMIT_URL: "redis://firecrawl-redis:6379"
  NUQ_DATABASE_URL: "postgresql://firecrawl:changeme@firecrawl-postgres:5432/firecrawl"
  NUQ_RABBITMQ_URL: "amqp://firecrawl-rabbitmq:5672"
  PLAYWRIGHT_MICROSERVICE_URL: "http://firecrawl-api:8080/scrape"

  # Database configuration
  POSTGRES_USER: "firecrawl"
  POSTGRES_DB: "firecrawl"
  POSTGRES_HOST: "firecrawl-postgres"
  POSTGRES_PORT: "5432"
  USE_DB_AUTHENTICATION: "false"

  # App scheme (Traefik-managed, so http:// on internal cluster)
  FIRECRAWL_APP_SCHEME: "http"
  FIRECRAWL_APP_HOST: "firecrawl-api"
  FIRECRAWL_APP_PORT: "8080"

  # Logging
  LOGGING_LEVEL: "INFO"

  # Webhook (set via secret when configured)
  SELF_HOSTED_WEBHOOK_URL: ""

  # Health/liveness settings
  HARNESS_STARTUP_TIMEOUT_MS: "60000"
  EXTRACT_WORKER_PORT: "3004"
  WORKER_PORT: "3005"
  NUQ_WORKER_PORT: "3006"
  NUQ_PREFETCH_WORKER_PORT: "3007"
  CCLOG_WORKER_PORT: "3008"
