# Jellyfin Traefik Ingress
#
# Routes https://jellyfin.littlewolfacres.com → jellyfin service:8096
# TLS certificate issued and renewed automatically by cert-manager via
# Cloudflare DNS-01 challenge.
#
# Traefik terminates TLS on websecure (443) and forwards plain HTTP to
# the jellyfin service. Same pattern as Navidrome/ArgoCD ingress.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: jellyfin
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - jellyfin.littlewolfacres.com
      secretName: jellyfin-tls
  rules:
    - host: jellyfin.littlewolfacres.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 8096
