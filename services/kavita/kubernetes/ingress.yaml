# Kavita Traefik Ingress
#
# Routes https://kavita.littlewolfacres.com → kavita service:5000
# TLS certificate issued and renewed automatically by cert-manager via
# Cloudflare DNS-01 challenge.
#
# Traefik terminates TLS on websecure (443) and forwards plain HTTP to
# the kavita service. Same pattern as Navidrome/Jellyfin ingress.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kavita
  namespace: kavita
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - kavita.littlewolfacres.com
      secretName: kavita-tls
  rules:
    - host: kavita.littlewolfacres.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kavita
                port:
                  number: 5000
