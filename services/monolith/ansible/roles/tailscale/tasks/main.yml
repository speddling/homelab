---
- name: Download Tailscale GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'

- name: Add Tailscale apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu {{ ansible_distribution_release }} main"
    state: present
    filename: tailscale

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: yes

- name: Enable and start tailscaled service
  ansible.builtin.systemd:
    name: tailscaled
    enabled: yes
    state: started

# --accept-routes is intentionally omitted from 'tailscale up':
# The monolith VM also runs k3s, which uses 10.42.0.0/16 (pods) and
# 10.43.0.0/16 (services) for its internal network. Accepting route
# advertisements from other Tailscale nodes can install routes that
# conflict with these CIDRs, causing k3s pods to become unreachable
# (e.g., ArgoCD repo-server at its ClusterIP). This was the root cause
# of the 18-day ArgoCD connection error starting 2026-07-18.
#
# If subnet routes are needed for a specific tailnet node, configure
# them on a dedicated machine (e.g., the watchtower VM) rather than
# on the k3s node.
- name: Bring Tailscale up with auth key
  ansible.builtin.command: >
    tailscale up
    --reset
    --authkey={{ tailscale_auth_key }}
  register: tailscale_up
  changed_when: "'Logged in' in tailscale_up.stdout or tailscale_up.rc == 0"
  failed_when: tailscale_up.rc != 0 and 'is already running' not in tailscale_up.stderr
  notify: Restart tailscale
