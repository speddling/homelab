---
- name: Download Tailscale GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'

- name: Add Tailscale apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu {{ ansible_distribution_release }} main"
    state: present
    filename: tailscale

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: yes

- name: Enable and start tailscaled service
  ansible.builtin.systemd:
    name: tailscaled
    enabled: yes
    state: started

- name: Bring Tailscale up with auth key
  ansible.builtin.command: >
    tailscale up
    --reset
    --authkey={{ tailscale_auth_key }}
    --accept-routes
  register: tailscale_up
  changed_when: "'Logged in' in tailscale_up.stdout or tailscale_up.rc == 0"
  failed_when: tailscale_up.rc != 0 and 'is already running' not in tailscale_up.stderr
  notify: Restart tailscale
